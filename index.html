<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Anak Tidak Sekolah (ATS) — BBPMP Jawa Timur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #e0f2fe; overflow: hidden; }
    header { background: #0284c7; color: white; padding: 5px 16px; font-weight: 700; border-bottom: 3px solid #38bdf8; }
    .header-subtitle { display: block; padding-left: 0; font-size: 13px; }
    .header-brand { display: inline-flex; align-items: center; gap: 10px; }
    .header-logo { width: 48px; height: 48px; flex: 0 0 auto; }
    .header-title { font-size: 15px; line-height: 1.2; }
    @media (max-width: 480px) {
      header { padding: 5px 10px; }
      .header-brand { gap: 8px; }
      .header-logo { width: 42px; height: 42px; }
      .header-title { font-size: 12px; }
      .header-subtitle { font-size: 11px; }
    }
    #map { flex: 1; width: 100%; height: 100%; }
    .ats-card { min-width: 250px; text-align: center; }
    .ats-card h3 { font-size: 15px; color: #0369a1; margin-bottom: 4px; border-bottom: 2px dashed #bae6fd; padding-bottom: 4px; font-weight: bold; }
    .ats-total { font-size: 12px; color: #475569; margin-bottom: 8px; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
    .ats-btn { flex: 1; padding: 8px 4px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; color: white; }
    .btn-green { background: #16a34a; }
    .btn-red { background: #dc2626; }
    .btn-yellow { background: #eab308; color: #713f12; }
    .data-display { background: #fffbeb; border: 1.5px solid #fde047; border-radius: 8px; padding: 8px; font-size: 12px; text-align: left; display: none; }
    .data-display.active { display: block; }
    .map-legend {
      position: absolute;
      z-index: 1000;
      left: 14px;
      bottom: 14px;
      width: 150px;
      padding: 7px 8px;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: rgba(248, 250, 252, 0.96);
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.16);
      color: #475569;
    }
    .legend-heading {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
      color: #1e293b;
      font-size: 10px;
      font-weight: 700;
    }
    .legend-pin { font-size: 13px; }
    .legend-description {
      padding-bottom: 5px;
      border-bottom: 1px solid #dbe4ee;
      color: #64748b;
      font-size: 9px;
      line-height: 1.3;
    }
    .legend-items { display: grid; gap: 4px; padding-top: 5px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 9px; }
    .legend-dot {
      flex: 0 0 9px;
      width: 9px;
      height: 9px;
      border: 1.5px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12);
    }
    @media (max-width: 480px) {
      .map-legend { left: 10px; bottom: 10px; width: 150px; padding: 7px 8px; }
      .legend-heading { font-size: 10px; }
      .legend-description, .legend-item { font-size: 9px; }
    }
  </style>
</head>

    const map = L.map('map').setView([-7.7, 112.8], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function createPopup(d) {
      const div = document.createElement('div');
      div.className = 'ats-card';
      div.innerHTML = `
        <h3>${d.name}</h3>
        <div class="ats-total">Total ATS: <b>${d.total.toLocaleString('id-ID')} anak</b></div>
        <div class="btn-group">
          <button class="ats-btn btn-green" onclick="show('${d.name}', 'bpb')">🟢 BPB</button>
          <button class="ats-btn btn-red" onclick="show('${d.name}', 'do')">🔴 DO</button>
          <button class="ats-btn btn-yellow" onclick="show('${d.name}', 'ltm')">🟡 LTM</button>
        </div>
        <div id="box-${d.name.replace(/[^a-zA-Z]/g, '')}" class="data-display"></div>
      `;
      return div;
    }

    window.show = function(name, type) {
      const d = atsData.find(x => x.name === name);
      const box = document.getElementById('box-' + name.replace(/[^a-zA-Z]/g, ''));
      if (!d || !box) return;
      box.classList.add('active');

      if (type === 'bpb') {
        box.innerHTML = `<b style="color:#16a34a">🟢 Belum Pernah Sekolah (BPB):</b><br><span style="font-size:15px; font-weight:bold;">${d.bpb.toLocaleString('id-ID')} anak</span> (${d.bpbPct})`;
      } else if (type === 'do') {
        box.innerHTML = `<b style="color:#dc2626">🔴 Putus Sekolah (DO):</b><br><span style="font-size:15px; font-weight:bold;">${d.doV.toLocaleString('id-ID')} anak</span> (${d.doPct})`;
      } else if (type === 'ltm') {
        box.innerHTML = `<b style="color:#a16207">🟡 Lulus Tidak Melanjutkan (LTM):</b><br><span style="font-size:15px; font-weight:bold;">${d.ltm.toLocaleString('id-ID')} anak</span> (${d.ltmPct})`;
      }
    };

    atsData.forEach(d => {
      const marker = L.circleMarker([d.lat, d.lng], { radius: 8, fillColor: '#0284c7', color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(map);
      marker.bindPopup(createPopup(d), { maxWidth: 280 });
    });
  </script>
</body>
</html>
