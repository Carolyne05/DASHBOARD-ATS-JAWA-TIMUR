<html lang="id">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f1f5f9; overflow: hidden; }
    header { position: relative; z-index: 1000; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: linear-gradient(135deg, #075985, #0284c7); color: white; padding: 14px 24px; box-shadow: 0 3px 14px #0f172a33; }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .header-subtitle { font-size: 11px; font-weight: 400; opacity: .8; margin-top: 3px; }
    .header-badge { padding: 7px 12px; border: 1px solid #ffffff55; border-radius: 999px; font-size: 11px; white-space: nowrap; background: #ffffff18; }
    #map { flex: 1; width: 100%; height: 100%; background: #dbeafe; }
    .map-year-badge { position: absolute; z-index: 500; top: 12px; right: 12px; padding: 8px 12px; border: 1px solid #ffffffaa; border-radius: 999px; background: linear-gradient(135deg, #075985ee, #0284c7ee); color: white; box-shadow: 0 3px 10px #0f172a44; font-size: 11px; font-weight: 700; letter-spacing: .2px; backdrop-filter: blur(4px); }
    .map-panel { position: absolute; z-index: 500; left: 10px; bottom: 10px; width: 180px; padding: 9px 10px; border: 1px solid #ffffff; border-radius: 10px; background: linear-gradient(145deg, #fffffffa, #f8fafcf5); box-shadow: 0 5px 14px #0f172a2b; backdrop-filter: blur(8px); }
    .map-panel h2 { display: flex; align-items: center; gap: 5px; color: #0f172a; font-size: 10px; line-height: 1.25; margin-bottom: 5px; }
    .map-panel h2::before { content: '📍'; font-size: 11px; }
    .map-panel p { color: #64748b; font-size: 9px; line-height: 1.35; margin-bottom: 7px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }
    .legend { display: grid; gap: 5px; color: #334155; font-size: 9px; }
    .legend-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .legend-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1.5px #e0f2fe; }
    .leaflet-control-zoom { border: 1px solid #cbd5e1 !important; box-shadow: 0 2px 8px #0f172a22 !important; }
    .leaflet-control-zoom a { color: #0369a1 !important; border-bottom: 1px solid #e2e8f0 !important; }
    .ats-card { min-width: 300px; text-align: center; }
    .ats-card h3 { font-size: 15px; color: #0369a1; margin-bottom: 4px; border-bottom: 2px dashed #bae6fd; padding-bottom: 4px; font-weight: bold; }
    .ats-total { font-size: 12px; color: #475569; margin-bottom: 8px; }
    .ats-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
    .ats-column { border: 0; border-radius: 7px; padding: 7px 4px; font-size: 10px; line-height: 1.35; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .ats-column:hover, .ats-column:focus { transform: translateY(-2px); box-shadow: 0 2px 7px #64748b88; outline: 2px solid #0284c7; }
    .ats-column strong { display: block; font-size: 11px; margin-bottom: 3px; }
    .ats-column span, .ats-column em { display: none; }
    .ats-column.active span, .ats-column.active em { display: block; }
    .ats-column em { font-style: normal; }
    .ats-detail { min-height: 30px; margin-top: 8px; padding-top: 6px; border-top: 1px solid #cbd5e1; font-size: 11px; color: #334155; }
    .column-bpb { background: #dcfce7; color: #166534; }
    .column-do { background: #fee2e2; color: #991b1b; }
    .column-ltm { background: #fef3c7; color: #92400e; }
  </style>
</head>

    const map = L.map('map').setView([-7.7, 112.8], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    function createPopup(d) {
      const div = document.createElement('div');
      div.className = 'ats-card';
      div.innerHTML = `
        <h3>${d.name}</h3>
        <div class="ats-total">Total ATS: <b>${d.total.toLocaleString('id-ID')} anak</b></div>
        <div class="ats-columns">
          <button type="button" class="ats-column column-bpb" data-type="bpb">
            <strong>🟢 BPB</strong>
            <span>${d.bpb.toLocaleString('id-ID')}</span>
            <em>${d.bpbPct}</em>
          </button>
          <button type="button" class="ats-column column-do" data-type="do">
            <strong>🔴 DO</strong>
            <span>${d.doV.toLocaleString('id-ID')}</span>
            <em>${d.doPct}</em>
          </button>
          <button type="button" class="ats-column column-ltm" data-type="ltm">
            <strong>🟡 LTM</strong>
            <span>${d.ltm.toLocaleString('id-ID')}</span>
            <em>${d.ltmPct}</em>
          </button>
        </div>
        <div class="ats-detail" aria-live="polite">Klik salah satu kolom untuk melihat detail.</div>
      `;

      const detail = div.querySelector('.ats-detail');
      div.querySelectorAll('.ats-column').forEach(button => {
        button.addEventListener('click', () => {
          div.querySelectorAll('.ats-column').forEach(item => item.classList.remove('active'));
          button.classList.add('active');
          const type = button.dataset.type;
          const labels = {
            bpb: ['🟢 Belum Pernah Sekolah (BPB)', d.bpb, d.bpbPct, '#16a34a'],
            do: ['🔴 Putus Sekolah (DO)', d.doV, d.doPct, '#dc2626'],
            ltm: ['🟡 Lulus Tidak Melanjutkan (LTM)', d.ltm, d.ltmPct, '#a16207']
          };
          const [label, value, percentage, color] = labels[type];
          detail.innerHTML = `<b style="color:${color}">${label}:</b> ${value.toLocaleString('id-ID')} anak (${percentage})`;
        });
      });

      return div;
    }

    window.show = function(name, type) {
      const d = atsData.find(x => x.name === name);
      const box = document.getElementById('box-' + name.replace(/[^a-zA-Z]/g, ''));
      if (!d || !box) return;
      box.classList.add('active');

      if (type === 'bpb') {
        box.innerHTML = `<b style="color:#16a34a">🟢 Belum Pernah Sekolah (BPB):</b><br><span style="font-size:15px; font-weight:bold;">${d.bpb.toLocaleString('id-ID')} anak</span> (${d.bpbPct})`;
      } else if (type === 'do') {
        box.innerHTML = `<b style="color:#dc2626">🔴 Putus Sekolah (DO):</b><br><span style="font-size:15px; font-weight:bold;">${d.doV.toLocaleString('id-ID')} anak</span> (${d.doPct})`;
      } else if (type === 'ltm') {
        box.innerHTML = `<b style="color:#a16207">🟡 Lulus Tidak Melanjutkan (LTM):</b><br><span style="font-size:15px; font-weight:bold;">${d.ltm.toLocaleString('id-ID')} anak</span> (${d.ltmPct})`;
      }
    };

    atsData.forEach(d => {
      const marker = L.circleMarker([d.lat, d.lng], { radius: 8, fillColor: '#0284c7', color: '#fff', weight: 2, fillOpacity: 0.9 }).addTo(map);
      marker.bindPopup(createPopup(d), { maxWidth: 280 });
    });

</body>
</html>
